name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet test --solution SelectView.FSharp.SystemTextJson.OpenApi.slnx --configuration Release
      - run: dotnet pack src/SelectView.FSharp.SystemTextJson.OpenApi --configuration Release --output artifacts -p:Version=${GITHUB_REF_NAME#v}
        if: startsWith(github.ref, 'refs/tags/v')
      - run: dotnet pack src/SelectView.FSharp.SystemTextJson.OpenApi --configuration Release --output artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
